<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">Fewer groups can hide a wrong decision</title><desc id="desc">01  ORIGINAL ALERTS: 8 synthetic alerts; normal paging unchanged. 02  LABEL-BASED BASELINE: 5 groups; 50% pairwise precision. 03  INSPECT THE FALSE MERGE: Separate a3 from the a1 / a2 incident. 04  CORRECTED LAB GROUPING: 6 groups; model improvement not yet measured</desc><rect width="720" height="660" rx="20" fill="#080e16"/><text x="32" y="48" fill="#f5f7fa" font-family="Arial,sans-serif" font-size="23" font-weight="bold">Fewer groups can hide a wrong decision</text><rect x="32" y="78" width="656" height="96" rx="12" fill="#0d1b2a" stroke="#285878"/><rect x="32" y="98" width="4" height="56" rx="2" fill="#0099ff"/><text x="54" y="112" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#78cbff">01  ORIGINAL ALERTS</text><text x="54" y="143" font-family="Arial,sans-serif" font-size="20" fill="#e3eaf2">8 synthetic alerts; normal paging unchanged</text><path d="M360 180v19m-6-6 6 6 6-6" fill="none" stroke="#55b9fa" stroke-width="2"/><rect x="32" y="206" width="656" height="96" rx="12" fill="#0d1b2a" stroke="#285878"/><rect x="32" y="226" width="4" height="56" rx="2" fill="#0099ff"/><text x="54" y="240" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#78cbff">02  LABEL-BASED BASELINE</text><text x="54" y="271" font-family="Arial,sans-serif" font-size="20" fill="#e3eaf2">5 groups; 50% pairwise precision</text><path d="M360 308v19m-6-6 6 6 6-6" fill="none" stroke="#55b9fa" stroke-width="2"/><rect x="32" y="334" width="656" height="96" rx="12" fill="#0d1b2a" stroke="#285878"/><rect x="32" y="354" width="4" height="56" rx="2" fill="#0099ff"/><text x="54" y="368" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#78cbff">03  INSPECT THE FALSE MERGE</text><text x="54" y="399" font-family="Arial,sans-serif" font-size="20" fill="#e3eaf2">Separate a3 from the a1 / a2 incident</text><path d="M360 436v19m-6-6 6 6 6-6" fill="none" stroke="#55b9fa" stroke-width="2"/><rect x="32" y="462" width="656" height="96" rx="12" fill="#0d1b2a" stroke="#285878"/><rect x="32" y="482" width="4" height="56" rx="2" fill="#0099ff"/><text x="54" y="496" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#78cbff">04  CORRECTED LAB GROUPING</text><text x="54" y="527" font-family="Arial,sans-serif" font-size="20" fill="#e3eaf2">6 groups; model improvement not yet measured</text><text x="32" y="620" font-family="Arial,sans-serif" font-size="18" fill="#b6c5d5">Grouping is a review aid, not permission to silence alerts.</text></svg>