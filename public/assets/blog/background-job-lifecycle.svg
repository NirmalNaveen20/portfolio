<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img" aria-labelledby="title desc"><title id="title">Background job monitoring lifecycle</title><desc id="desc">Four stages from acceptance to a ready report. Retries retain the original customer deadline.</desc><rect width="720" height="620" rx="24" fill="#080f18"/><g font-family="Arial,sans-serif"><text x="40" y="48" fill="#edf6ff" font-size="25" font-weight="bold">Follow the job to its outcome</text><rect x="40" y="80" width="640" height="92" rx="14" fill="#101e2c" stroke="#3375a6"/><text x="62" y="112" fill="#70c7ff" font-size="18" font-weight="bold">01  ACCEPT</text><text x="62" y="143" fill="#d5e1ed" font-size="20">Record job + original acceptance time</text><path d="M360 175v18m-5-5 5 5 5-5" fill="none" stroke="#70c7ff" stroke-width="2"/><rect x="40" y="198" width="640" height="92" rx="14" fill="#101e2c" stroke="#3375a6"/><text x="62" y="230" fill="#70c7ff" font-size="18" font-weight="bold">02  QUEUE</text><text x="62" y="261" fill="#d5e1ed" font-size="20">Measure wait, backlog and oldest age</text><path d="M360 293v18m-5-5 5 5 5-5" fill="none" stroke="#70c7ff" stroke-width="2"/><rect x="40" y="316" width="640" height="92" rx="14" fill="#101e2c" stroke="#3375a6"/><text x="62" y="348" fill="#70c7ff" font-size="18" font-weight="bold">03  WORK</text><text x="62" y="379" fill="#d5e1ed" font-size="20">Track each attempt and bounded retries</text><path d="M360 411v18m-5-5 5 5 5-5" fill="none" stroke="#70c7ff" stroke-width="2"/><rect x="40" y="434" width="640" height="92" rx="14" fill="#101e2c" stroke="#3375a6"/><text x="62" y="466" fill="#70c7ff" font-size="18" font-weight="bold">04  READY</text><text x="62" y="497" fill="#d5e1ed" font-size="20">Confirm the customer can retrieve it</text><text x="40" y="574" fill="#b5c8da" font-size="18">One customer deadline, even across multiple attempts.</text></g></svg>